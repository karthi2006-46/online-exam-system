<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Manage Exams | LearnHub LMS</title>

    <link rel="stylesheet" href="/css/faculty/faculty.css">
    <link rel="stylesheet" href="/css/faculty/manage-exams.css">
    <link rel="stylesheet" href="/css/faculty/faculty-sidebar.css">
</head>

<body>
<div class="app-layout fs-layout">

    <!-- SIDEBAR (injected by faculty-sidebar.js) -->
    <div id="facultySidebar"></div>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-title">
                <p class="breadcrumb">Workspace / Exams</p>
                <h1>Manage exams</h1>
                <p class="subtitle">Create, publish and manage course examinations.</p>
            </div>

            <div class="topbar-right">
                <button class="primary-button" id="openCreateModal" type="button">+ Create exam</button>
            </div>
        </header>

        <section class="toolbar" aria-label="Filter exams">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" id="examSearch" placeholder="Search exams" aria-label="Search exams">
            </div>

            <select id="courseFilter" aria-label="Filter by course">
                <option value="">All assigned courses</option>
            </select>

            <select id="statusFilter" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
            </select>
        </section>

        <div id="examMessage" class="state-message" role="status" aria-live="polite">Loading exams...</div>

        <section id="examGrid" class="exam-grid" aria-label="Exams"></section>

        <footer class="footer">
            <span>© <span id="year"></span> LearnHub LMS</span>
            <span>Faculty workspace</span>
        </footer>
    </main>
</div>

<!-- CREATE / EDIT EXAM -->
<div class="modal" id="examModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2 id="modalTitle">Create exam</h2>
                <p class="muted">Enter the examination details.</p>
            </div>
            <button class="close-button" id="closeCreateModal" type="button" aria-label="Close">&times;</button>
        </div>

        <form id="examForm">
            <div id="formError" class="form-error" role="alert"></div>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="courseId">Course <b>*</b></label>
                    <select id="courseId" required>
                        <option value="">Select a course</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="title">Exam title <b>*</b></label>
                    <input id="title" maxlength="200" placeholder="e.g. Java Fundamentals Assessment" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Enter exam instructions or description"></textarea>
                </div>

                <div class="form-group">
                    <label for="totalQuestions">Total questions <b>*</b></label>
                    <input type="number" id="totalQuestions" min="1" step="1" required>
                </div>

                <div class="form-group">
                    <label for="durationMinutes">Duration (minutes) <b>*</b></label>
                    <input type="number" id="durationMinutes" min="1" step="1" required>
                </div>

                <div class="form-group">
                    <label for="totalMarks">Total marks <b>*</b></label>
                    <input type="number" id="totalMarks" min="1" step="1" required>
                </div>

                <div class="form-group">
                    <label for="passingMarks">Passing marks <b>*</b></label>
                    <input type="number" id="passingMarks" min="0" step="1" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="secondary-button" id="cancelCreate">Cancel</button>
                <button type="submit" class="primary-button" id="saveExamButton">Create exam</button>
            </div>
        </form>
    </div>
</div>

<!-- MANAGE QUESTIONS -->
<div class="modal" id="questionsModal" role="dialog" aria-modal="true" aria-labelledby="questionsModalTitle">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2 id="questionsModalTitle">Manage questions</h2>
                <p class="muted" id="questionsExamTitle">Add and manage MCQ questions for this exam.</p>
            </div>
            <button class="close-button" id="closeQuestionsModal" type="button" aria-label="Close">&times;</button>
        </div>

        <div id="questionsMessage" class="question-summary" role="status" aria-live="polite">Loading questions...</div>
        <div id="questionList" class="question-list"></div>

        <div class="modal-divider"></div>

        <h3 id="questionFormTitle" class="form-title">Add a question</h3>
        <form id="questionForm" class="question-form">
            <div id="questionFormError" class="form-error" role="alert"></div>
            <input type="hidden" id="questionId">

            <div class="form-group">
                <label for="questionText">Question <b>*</b></label>
                <textarea id="questionText" maxlength="5000" required placeholder="Enter the question"></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group"><label for="optionA">Option A <b>*</b></label><input id="optionA" required maxlength="1000"></div>
                <div class="form-group"><label for="optionB">Option B <b>*</b></label><input id="optionB" required maxlength="1000"></div>
                <div class="form-group"><label for="optionC">Option C <b>*</b></label><input id="optionC" required maxlength="1000"></div>
                <div class="form-group"><label for="optionD">Option D <b>*</b></label><input id="optionD" required maxlength="1000"></div>
                <div class="form-group">
                    <label for="correctAnswer">Correct answer <b>*</b></label>
                    <select id="correctAnswer" required>
                        <option value="">Select answer</option>
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="questionMarks">Marks <b>*</b></label>
                    <input id="questionMarks" type="number" min="1" step="1" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="secondary-button" id="cancelQuestionEdit">Clear</button>
                <button type="submit" class="primary-button" id="saveQuestionButton">Add question</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/api-config.js"></script>
<script src="/js/faculity/faculty-sidebar.js"></script>
<script src="/js/faculity/manage-exams.js"></script>
</body>
</html>
