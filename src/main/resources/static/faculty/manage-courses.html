<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Manage Courses | LearnHub LMS</title>

    <link rel="stylesheet" href="/css/faculty/faculty.css">
    <link rel="stylesheet" href="/css/faculty/manage-courses.css">
    <link rel="stylesheet" href="/css/faculty/faculty-sidebar.css">
</head>

<body>
<div class="app-layout fs-layout">

    <!-- SIDEBAR (injected by faculty-sidebar.js) -->
    <div id="facultySidebar"></div>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-title">
                <p class="breadcrumb">Workspace / Courses</p>
                <h1>Manage courses</h1>
                <p class="subtitle">View and manage the courses assigned to your account.</p>
            </div>

            <div class="topbar-right">
                <div id="courseSummary" class="summary-pill">Loading courses...</div>
            </div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" id="courseSearch" class="search-input"
                       placeholder="Search by course name or code"
                       aria-label="Search courses">
            </div>
        </div>

        <div id="courseMessage" class="state-message" role="status" aria-live="polite">
            Loading your assigned courses...
        </div>

        <section id="courseGrid" class="course-grid" aria-label="Your courses"></section>

        <footer class="footer">
            <span>© <span id="year"></span> LearnHub LMS</span>
            <span>Faculty workspace</span>
        </footer>

    </main>
</div>

<script src="/js/api-config.js"></script>
<script src="/js/faculity/faculty-sidebar.js"></script>
<script src="/js/faculity/manage-courses.js"></script>
</body>
</html>
