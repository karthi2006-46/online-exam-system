<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Approvals | LearnHub Faculty Portal</title>

    <link rel="stylesheet" href="/css/faculty/faculty-sidebar.css">
    <link rel="stylesheet" href="/css/faculty/exam-approval-requests.css">
</head>

<body>

    <div class="fs-layout">

        <!-- Faculty Sidebar -->
        <div id="facultySidebar"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="container">

                <div class="page-header">
                    <div>
                        <div class="breadcrumb">
                            Faculty Portal / Exam Approvals
                        </div>

                        <h1>Exam Approval Management</h1>

                        <p>
                            Review student eligibility and manage
                            exam access requests.
                        </p>
                    </div>

                    <button class="refresh-btn"
                            onclick="loadApprovalRequests()">
                        ↻ Refresh
                    </button>
                </div>

                <!-- Statistics -->
                <div class="stats-grid">

                    <div class="stat-card">
                        <span>Total Requests</span>
                        <h2 id="totalRequests">0</h2>
                    </div>

                    <div class="stat-card">
                        <span>Pending</span>
                        <h2 id="pendingRequests">0</h2>
                    </div>

                    <div class="stat-card">
                        <span>Approved</span>
                        <h2 id="approvedRequests">0</h2>
                    </div>

                    <div class="stat-card">
                        <span>Rejected</span>
                        <h2 id="rejectedRequests">0</h2>
                    </div>

                </div>

                <!-- Requests -->
                <div class="requests-section">

                    <div class="section-header">
                        <h2>Student Approval Requests</h2>
                        <span>Review and manage requests</span>
                    </div>

                    <div id="requestsContainer">
                        <p class="loading">Loading requests...</p>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/faculity/faculty-sidebar.js"></script>
    <script src="/js/faculity/exam-approval-requests.js"></script>

</body>
</html>
