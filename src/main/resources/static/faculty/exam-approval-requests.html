<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam Approval Requests</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
            color: #1f2937;
        }

        .request-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .request-card h3 {
            margin-top: 0;
            color: #111827;
        }

        .request-info {
            margin: 8px 0;
            color: #374151;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
            font-weight: bold;
        }

        .actions {
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .approve-btn {
            background: #16a34a;
            color: white;
        }

        .reject-btn {
            background: #dc2626;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .loading {
            font-size: 18px;
            color: #555;
        }

        .no-requests {
            background: white;
            padding: 25px;
            border-radius: 10px;
            color: #666;
        }

        .error {
            color: red;
            background: #fee2e2;
            padding: 15px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Exam Approval Requests</h1>

    <div id="requestsContainer">

        <p class="loading">
            Loading...
        </p>

    </div>

</div>

<script src="../js/faculity/exam-approval-requests.js"></script>

</body>

</html>
