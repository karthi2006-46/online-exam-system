<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Practice programming and track your coding challenge progress.">
    <title>Coding Challenges | LMS</title>

    <!-- Load order matters: theme -> sidebar -> page styles -->
    <link rel="stylesheet" href="../css/student/student-theme.css">
    <link rel="stylesheet" href="../css/student/student-sidebar.css">
    <link rel="stylesheet" href="../css/student/coding-challenges.css">
</head>
<body>
<div class="container">

    <div id="studentSidebar"></div>

    <main class="main-content">

        <header class="header">
            <div class="page-heading">
                <h1>Coding Challenges</h1>
                <p>Write your solution, submit it, and wait for faculty approval.</p>
            </div>
            <div class="header-actions">
                <a class="btn-secondary" href="my-courses.html">Back to My Courses</a>
                <button type="button" class="btn-secondary" id="refreshBtn">Refresh</button>
            </div>
        </header>

        <section class="summary" aria-labelledby="courseTitle">
            <div class="summary-row">
                <div>
                    <span class="section-label">Course</span>
                    <h2 id="courseTitle">Loading course...</h2>
                </div>
                <div class="summary-count">
                    <strong id="completedCount">0 / 0</strong>
                    <span>approved</span>
                </div>
            </div>

            <div class="progress-track" role="progressbar" aria-label="Approved coding challenges"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <p class="eligibility" id="eligibilityText" aria-live="polite">Checking exam eligibility...</p>
        </section>

        <section class="challenge-list-section" aria-label="Coding challenges">
            <div id="challengesContainer" aria-live="polite" aria-busy="false">
                <div class="empty"><p>Loading coding challenges...</p></div>
            </div>
        </section>

        <footer class="page-footer">
            <span>LMS Student Portal</span><span>Keep practising. Keep improving.</span>
        </footer>

    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    const sidebarContainer = document.getElementById("studentSidebar");
    if (!sidebarContainer) return;

    try {
        const response = await fetch("student-sidebar.html");
        if (!response.ok) throw new Error("HTTP " + response.status);

        sidebarContainer.innerHTML = await response.text();

        const script = document.createElement("script");
        script.src = "../js/student/student-sidebar.js";
        script.onload = function () {
            if (typeof window.initializeStudentSidebar === "function") {
                window.initializeStudentSidebar();
            }
        };
        document.body.appendChild(script);

    } catch (error) {
        console.error("Sidebar loading failed:", error);
        sidebarContainer.innerHTML = "<p>Unable to load navigation. Please refresh the page.</p>";
    }
});
</script>
<script src="/js/api-config.js"></script>
<script src="../js/student/coding-challenges.js"></script>
</body>
</html>
